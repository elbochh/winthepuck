# ===========================================================
# Run the whole thing on a laptop with one command:
#
#     docker compose up --build
#     open http://localhost:8000
#
# No Python, no virtual environment, no Azure account. This is the same image
# that would be deployed, so "it works on my machine" means something.
# ===========================================================

services:
  website:
    build:
      context: ./winthepuck-cloud
    image: winthepuck:local
    ports:
      - "8000:8000"
    environment:
      # A fixed key here so sign-ins survive a restart while developing. On
      # Azure this comes from the App Service settings and is a real secret.
      SECRET_KEY: "local-development-key-not-for-production"
      # Set this to try the refresh endpoint locally:
      #   docker compose run --rm refresh
      REFRESH_TOKEN: "local-refresh-token"
      WINTHEPUCK_DATA_DIR: "/data"
    volumes:
      # Members, picks and comments survive `docker compose down`.
      - winthepuck-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # The prediction job, on demand rather than always running. It is the same
  # thing GitHub Actions runs once a day:
  #
  #     docker compose run --rm refresh
  #
  # It downloads today's schedule from the NHL, runs the trained model over the
  # upcoming games and posts the answers to the website container.
  refresh:
    build:
      context: ./model-service
    image: winthepuck-model:local
    depends_on:
      website:
        condition: service_healthy
    environment:
      SITE_URL: "http://website:8000"
      REFRESH_TOKEN: "local-refresh-token"
    profiles: ["jobs"]      # only starts when asked for by name

volumes:
  winthepuck-data:
