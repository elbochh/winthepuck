# ===========================================================
# Tooling for the whole repository
#
# One file so that "how do I lint this?" and "how do I run the tests?" have
# the same answer everywhere, and so the GitHub Actions workflow runs exactly
# what a person runs on their laptop.
# ===========================================================

[tool.pytest.ini_options]
testpaths = [
    "Phase 5/winthepuck-cloud/tests",
    "Phase 5/model-service/tests",
]
# The website and the model service are deployed separately and neither is an
# installed package, so their folders go on the import path directly.
pythonpath = [
    "Phase 5/winthepuck-cloud",
    "Phase 5/model-service",
]
addopts = "-q --strict-markers"
markers = [
    "network: talks to the real NHL API (skipped by default, run with -m network)",
    "slow: takes more than a second (skip while working with -m 'not slow')",
]
filterwarnings = ["error::DeprecationWarning"]


[tool.coverage.run]
source = ["Phase 5/winthepuck-cloud", "Phase 5/model-service"]
omit = [
    "*/tests/*",
    # Retraining needs the 18 GB Phase 1 dataset, so it cannot run on a CI
    # runner and there is nothing honest to measure here.
    "*/build_serving_bundle.py",
    "*/export_history.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
skip_covered = false
precision = 1


[tool.ruff]
line-length = 96
target-version = "py312"
exclude = [
    ".venv", "venv", "__pycache__", ".next", "node_modules",
    # Phases 1-4 were submitted for marking and are kept exactly as they were
    # handed in. Reformatting them now would make the repository disagree with
    # the reports that describe it, so the linter is pointed at the code that
    # is still being worked on.
    "nhl_data_pipeline",
    "nhl_model",
    "Phase 2",
    "Phase 3",
    "Phase 4",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle - spacing and layout
    "F",    # pyflakes - unused imports, undefined names, real mistakes
    "I",    # isort - imports in a predictable order
    "B",    # bugbear - the loop-variable-in-closure class of bug
    "UP",   # pyupgrade - modern syntax
    "SIM",  # flake8-simplify
    "C4",   # comprehensions
]
ignore = [
    "E501",  # long lines are caught by the formatter, not worth failing a build
    "B008",  # calling a function in a default argument is deliberate in Flask
]

[tool.ruff.lint.isort]
# Neither deployable is an installed package - each is a flat folder of
# modules imported by name - so ruff has to be told which names are ours,
# or it files them alongside numpy and pandas.
known-first-party = [
    "app", "config", "database", "metrics", "monitoring", "nhl_data",
    "scoring", "security",
    "elo", "nhl_api", "form_book", "refresh_predictions", "evaluate_model",
    "build_serving_bundle", "export_history",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately poke at private helpers and re-import modules.
"**/tests/*" = ["E402"]


[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
# The codebase is annotated but not exhaustively, so untyped bodies are still
# allowed. Turning this up is the next step, not a blocker today.
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
exclude = "(tests|build_serving_bundle|export_history)"
