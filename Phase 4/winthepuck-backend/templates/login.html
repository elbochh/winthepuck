{% extends "layout.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}

<section class="section narrow page-top">
  <div class="glass auth-card">
    <h2 class="section-title center">Sign in</h2>
    <p class="section-desc center">Sign in to save picks, post messages and climb the leaderboard.</p>

    <form method="post" class="auth-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />

      <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
    </form>

    <p class="muted small center auth-switch">
      New here? <a href="{{ url_for('register') }}" class="accent bold">Create an account</a>
    </p>

    <p class="muted tiny center demo-hint">
      Demo account for testing — username <span class="mono bold">FrozenOracle</span>,
      password <span class="mono bold">{{ demo_password }}</span>
    </p>
  </div>
</section>

{% endblock %}
